# ---------------------------------------------------------------------------
# StockSense database configuration
#
# This is the only place where database settings live. Edit the values below
# so they match your local MySQL installation, then rebuild/redeploy.
# Each value can also be overridden without editing this file, with a JVM
# system property (-Ddb.password=...) or an environment variable
# (DB_URL, DB_USER, DB_PASSWORD) - handy for keeping secrets out of the WAR.
#
# In a .properties file the '&' inside the URL is written literally (no &amp;).
# ---------------------------------------------------------------------------

# JDBC driver class (Connector/J 8.x).
db.driver=com.mysql.cj.jdbc.Driver

# Database URL.
#   sslMode=DISABLED              - no SSL on a local development server
#   allowPublicKeyRetrieval=true  - needed for MySQL 8+ caching_sha2_password
db.url=jdbc:mysql://localhost:3306/stock_recommendation_db?sslMode=DISABLED&allowPublicKeyRetrieval=true

# MySQL user name.
db.user=root

# MySQL password. Leave empty when root has no password (fresh Homebrew install).
db.password=
