# ---------------------------------------------------------------------------
# StockSense configuration (Spring Boot)
#
# Every value can be overridden with an environment variable, so no password
# or API key ever needs to be written into this file:
#   DB_URL, DB_USER, DB_PASSWORD   database connection
#   DB_INIT=true                   create tables + sample data on an empty DB
#   MARKET_PROVIDER, ALPHA_VANTAGE_API_KEY
#   PORT                           HTTP port (set automatically by Railway)
# ---------------------------------------------------------------------------
spring.application.name=StockSense
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.error.include-message=never

# Database (MySQL 8+). createDatabaseIfNotExist lets DB_INIT start from an empty server.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stock_recommendation_db?sslMode=DISABLED&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
# Schema and sample data are loaded by DatabaseInitializer, not by Spring's own SQL init.
spring.sql.init.mode=never
app.db-init=${DB_INIT:false}

# Market data provider: DEMO (sample data only) or ALPHA_VANTAGE (needs a key).
market.provider=${MARKET_PROVIDER:DEMO}
market.api-key=${ALPHA_VANTAGE_API_KEY:}
market.base-url=https://www.alphavantage.co/query
market.cache-minutes=720
market.min-interval-ms=13000
market.timeout-seconds=15
market.daily-quota=25

spring.thymeleaf.cache=true
spring.jackson.serialization.write-dates-as-timestamps=false
