<!DOCTYPE html>
<!--/* Spring Boot's error view (404, 403 such as an expired form, 500). No stack traces are shown. */-->
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head th:replace="~{layout :: head(${status == 404 ? 'Page not found' : 'Something went wrong'})}"></head>
<body>
<th:block th:replace="~{layout :: top}"></th:block>
<main class="ss-main" id="main"><div class="container-xl">
    <div class="ss-card ss-empty">
        <div class="ss-empty-icon"><i class="bi bi-exclamation-circle" aria-hidden="true"></i></div>
        <h1 class="h4" th:text="${status == 404} ? 'Page not found' : (${status == 403} ? 'This form has expired' : 'Something went wrong')">Something went wrong</h1>
        <p th:if="${status == 404}">The page you asked for does not exist.</p>
        <p th:if="${status == 403}">The page was open too long or your session ended. Go back, reload the page and try again.</p>
        <p th:if="${status != 404 and status != 403}">An unexpected error occurred. Please try again.</p>
        <a class="btn btn-ghost" th:href="@{/}">Back to the start page</a>
    </div>
</div></main>
<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
