<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head th:replace="~{layout :: head('Stocks · Admin')}"></head>
<body>
<th:block th:replace="~{layout :: top}"></th:block>
<main class="ss-main" id="main"><div class="container-xl">
    <ul th:replace="~{layout :: messages}"></ul>

    <div class="ss-page-head">
        <div>
            <p class="ss-eyebrow">Administrator</p>
            <h1>Stock records</h1>
        </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-3">
        <form class="d-flex gap-2" method="get" th:action="@{/admin/stocks}" role="search">
            <label class="visually-hidden" for="q">Search</label>
            <input class="form-control" id="q" name="q" type="search" th:value="${q}" placeholder="Search ticker or company" style="max-width: 320px;"/>
            <button type="submit" class="btn btn-ghost">Search</button>
        </form>
        <a class="btn btn-primary ms-auto" th:href="@{/admin/stocks(new='')}" th:if="${form == null}">+ Add stock</a>
    </div>

    <form class="ss-card mb-3" th:if="${form != null}" th:action="@{/admin/stocks}" th:object="${form}" method="post">
        <h2 class="fs-6 mb-3" th:text="*{id > 0} ? |Edit *{symbol}| : 'New stock'"></h2>
        <input type="hidden" th:field="*{id}"/>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="companyName">Company name</label>
                <input class="form-control" th:field="*{companyName}" required maxlength="150"/>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="symbol">Ticker symbol</label>
                <input class="form-control text-uppercase" th:field="*{symbol}" required maxlength="20"/>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="exchange">Exchange</label>
                <input class="form-control text-uppercase" th:field="*{exchange}" required maxlength="20" placeholder="NASDAQ, BSE, NSE"/>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="apiSymbol">Provider symbol</label>
                <input class="form-control" th:field="*{apiSymbol}" maxlength="40" placeholder="e.g. RELIANCE.BSE"/>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="currency">Currency</label>
                <input class="form-control text-uppercase" th:field="*{currency}" required maxlength="3" placeholder="USD"/>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="sector">Sector</label>
                <input class="form-control" th:field="*{sector}" maxlength="80"/>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="industry">Industry</label>
                <input class="form-control" th:field="*{industry}" maxlength="120"/>
            </div>
            <div class="col-12">
                <label class="form-label" for="description">Description</label>
                <textarea class="form-control" th:field="*{description}" rows="3" maxlength="2000"></textarea>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="active" name="active" value="true" th:checked="*{active}"/>
                    <label class="form-check-label" for="active">Active (visible to users)</label>
                </div>
            </div>
        </div>
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary" th:text="*{id > 0} ? 'Save changes' : 'Add stock'"></button>
            <a class="btn btn-ghost" th:href="@{/admin/stocks}">Cancel</a>
        </div>
    </form>

    <div class="ss-card ss-card-flush">
        <div class="table-responsive">
            <table class="table table-hover ss-table">
                <thead>
                    <tr>
                        <th scope="col">Stock</th>
                        <th scope="col">Exchange</th>
                        <th scope="col" class="d-none d-lg-table-cell">Provider symbol</th>
                        <th scope="col" class="d-none d-md-table-cell">Sector</th>
                        <th scope="col" class="d-none d-md-table-cell">Latest data</th>
                        <th scope="col">Status</th>
                        <th scope="col" class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${stocks}">
                        <td>
                            <a class="ss-symbol" th:href="@{/stocks/{id}(id=${s.id})}" th:text="${s.symbol}"></a>
                            <div class="ss-company" th:text="${s.companyName}"></div>
                        </td>
                        <td><span class="ss-badge-source" th:text="${s.exchange}"></span> <span class="small ss-faint" th:text="${s.currency}"></span></td>
                        <td class="d-none d-lg-table-cell mono" th:text="${s.apiSymbol}"></td>
                        <td class="d-none d-md-table-cell small ss-muted" th:text="${s.sector}"></td>
                        <td class="d-none d-md-table-cell small">
                            <th:block th:if="${s.lastUpdated != null}" th:text="${@fmt.date(s.lastUpdated)}"></th:block>
                            <th:block th:replace="~{fragments/widgets :: dataBadge(${s.dataSource})}"></th:block>
                        </td>
                        <td><span class="small" th:classappend="${s.active} ? 'up' : 'down'" th:text="${s.active} ? 'Active' : 'Inactive'"></span></td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-ghost" th:href="@{/admin/stocks(edit=${s.id})}">Edit</a>
                            <form class="d-inline m-0" th:action="@{/admin/stocks/{id}/active(id=${s.id})}" method="post">
                                <input type="hidden" name="active" th:value="${!s.active}"/>
                                <button type="submit" class="btn btn-sm ms-1" th:classappend="${s.active} ? 'btn-ghost' : 'btn-success-soft'"
                                        th:text="${s.active} ? 'Deactivate' : 'Activate'"></button>
                            </form>
                            <form class="d-inline m-0" th:action="@{/admin/stocks/{id}/delete(id=${s.id})}" method="post"
                                  onsubmit="return confirm(this.dataset.confirm);"
                                  th:attr="data-confirm=|Permanently delete ${s.symbol} with all its prices, recommendations and watchlist entries? Deactivating keeps the history.|">
                                <button type="submit" class="btn btn-sm btn-danger-soft ms-1">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="small ss-faint mt-2">New stocks have no prices until a market data sync stores them. Deactivating hides a stock from users but keeps its history.</p>
</div></main>
<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
