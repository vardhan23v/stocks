<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head th:replace="~{layout :: head('Users · Admin')}"></head>
<body>
<th:block th:replace="~{layout :: top}"></th:block>
<main class="ss-main" id="main"><div class="container-xl">
    <ul th:replace="~{layout :: messages}"></ul>

    <div class="ss-page-head">
        <div>
            <p class="ss-eyebrow">Administrator</p>
            <h1>User accounts</h1>
        </div>
        <div class="small ss-muted" th:text="|${users.size()} accounts · ${activeCount} active · ${adminCount} admin|"></div>
    </div>

    <div class="ss-card ss-card-flush">
        <div class="table-responsive">
            <table class="table table-hover ss-table">
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col" class="d-none d-md-table-cell">Email</th>
                        <th scope="col">Role</th>
                        <th scope="col">Status</th>
                        <th scope="col" class="num text-end d-none d-lg-table-cell">Watchlist</th>
                        <th scope="col" class="d-none d-lg-table-cell">Created</th>
                        <th scope="col" class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td class="fw-semibold"><th:block th:text="${u.name}"></th:block><div class="small ss-muted d-md-none" th:text="${u.email}"></div></td>
                        <td class="d-none d-md-table-cell ss-muted" th:text="${u.email}"></td>
                        <td><span class="ss-role-pill" th:text="${u.role}"></span></td>
                        <td><span class="small" th:classappend="${u.active} ? 'up' : 'down'" th:text="${u.active} ? 'Active' : 'Deactivated'"></span></td>
                        <td class="num text-end d-none d-lg-table-cell" th:text="${u.watchlistCount}"></td>
                        <td class="d-none d-lg-table-cell small ss-muted" th:text="${@fmt.date(u.createdAt)}"></td>
                        <td class="text-end text-nowrap">
                            <span class="small ss-faint" th:if="${u.id == currentUser.id}">This is you</span>
                            <th:block th:unless="${u.id == currentUser.id}">
                                <form class="d-inline m-0" th:action="@{/admin/users/{id}/active(id=${u.id})}" method="post">
                                    <input type="hidden" name="active" th:value="${!u.active}"/>
                                    <button type="submit" class="btn btn-sm" th:classappend="${u.active} ? 'btn-ghost' : 'btn-success-soft'"
                                            th:text="${u.active} ? 'Deactivate' : 'Activate'"></button>
                                </form>
                                <form class="d-inline m-0" th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post"
                                      onsubmit="return confirm(this.dataset.confirm);" th:attr="data-confirm=|Change the role of ${u.name}?|">
                                    <input type="hidden" name="role" th:value="${u.admin} ? 'USER' : 'ADMIN'"/>
                                    <button type="submit" class="btn btn-sm btn-ghost ms-1" th:text="${u.admin} ? 'Make user' : 'Make admin'"></button>
                                </form>
                                <form class="d-inline m-0" th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                                      onsubmit="return confirm(this.dataset.confirm);" th:attr="data-confirm=|Permanently delete ${u.name} and their watchlist?|">
                                    <button type="submit" class="btn btn-sm btn-danger-soft ms-1">Delete</button>
                                </form>
                            </th:block>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="small ss-faint mt-2">Deactivated accounts cannot log in; their data is kept. You cannot change your own account here.</p>
</div></main>
<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
