# ---------------------------------------------------------------------------
# StockSense market data configuration
#
# market.provider
#   DEMO           - never calls the internet; uses the clearly labelled
#                    SAMPLE DATA rows loaded by sample-data.sql
#   ALPHA_VANTAGE  - fetches delayed end-of-day prices from Alpha Vantage
#                    (https://www.alphavantage.co). Needs an API key.
#
# market.apiKey
#   Never commit a real key. Prefer the environment variable
#   ALPHA_VANTAGE_API_KEY or the JVM property -Dmarket.apiKey=...; both
#   override the value below. When no key is available the application
#   falls back to DEMO mode automatically.
# ---------------------------------------------------------------------------
market.provider=DEMO
market.apiKey=
market.baseUrl=https://www.alphavantage.co/query

# A stock is not fetched again while its newest stored data is younger than this.
market.cacheMinutes=720

# Free Alpha Vantage keys allow about 5 requests per minute and 25 per day.
market.minIntervalMs=13000
market.timeoutSeconds=15
