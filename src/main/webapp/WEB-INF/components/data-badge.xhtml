<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">
<!--
  Provenance of a price: SAMPLE DATA, or the provider name. Never "live".
  Params: source (data_source value or null).
-->
<ui:fragment rendered="#{source eq 'SAMPLE'}">
    <span class="ss-badge-sample" title="Synthetic demonstration data - not a real market price">Sample data</span>
</ui:fragment>
<ui:fragment rendered="#{not empty source and source ne 'SAMPLE'}">
    <span class="ss-badge-source" title="Delayed end-of-day data from the configured provider">#{source eq 'ALPHA_VANTAGE' ? 'Alpha Vantage &#183; delayed' : source}</span>
</ui:fragment>
<ui:fragment rendered="#{empty source}">
    <span class="ss-badge-source">No data</span>
</ui:fragment>
</ui:composition>
