<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
<!-- Recommendation badge. Params: rec (a Recommendation, may be null). -->
<ui:fragment rendered="#{not empty rec}">
    <span class="ss-rec #{rec.recommendationType}">#{rec.label}</span>
</ui:fragment>
<ui:fragment rendered="#{empty rec}">
    <span class="ss-rec INSUFFICIENT_DATA">Not evaluated</span>
</ui:fragment>
</ui:composition>
